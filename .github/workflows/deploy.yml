# Rootwise - Deploy to Cloudflare Pages
# 
# This workflow builds the app and deploys to Cloudflare Pages.
# Cloudflare Pages is FREE, SEO-friendly, globally fast, and supports custom domains.
#
# SETUP STEPS:
# 1. Create a Cloudflare account at https://dash.cloudflare.com
# 2. Go to Workers & Pages > Create > Pages > Connect to Git (or use Direct Upload)
# 3. Or use Direct Upload (Wrangler) — this workflow uses that approach
#
# REQUIRED GITHUB SECRETS:
# - CLOUDFLARE_ACCOUNT_ID: Your Cloudflare account ID (found in dashboard URL or sidebar)
# - CLOUDFLARE_API_TOKEN: Create at https://dash.cloudflare.com/profile/api-tokens
#                          Use the "Cloudflare Pages: Edit" template
# - VITE_SUPABASE_URL: Your Supabase project URL
# - VITE_SUPABASE_ANON_KEY: Your Supabase publishable/anon key
# - GEMINI_API_KEY: Your Google Gemini API key
#
# CUSTOM DOMAIN:
# After first deploy, go to Cloudflare Pages > your project > Custom domains > Add
# Point your domain's DNS to Cloudflare (they provide instructions)

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rootwise
