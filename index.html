        <script>
            (function () {
                var banner = document.getElementById('consent-banner');
                if (!banner) return;

                var stored = localStorage.getItem('rw_consent');
                var applyConsent = function (consent) {
                    if (typeof gtag === 'function') {
                        gtag('consent', 'update', consent);
                    }
                };

                if (stored) {
                    try {
                        applyConsent(JSON.parse(stored));
                    } catch (_) {
                        localStorage.removeItem('rw_consent');
                        banner.style.display = 'block';
                    }
                    return;
                }

                banner.style.display = 'block';

                var acceptBtn = document.getElementById('consent-accept');
                var rejectBtn = document.getElementById('consent-reject');

                var accept = function () {
                    var consent = {
                        ad_storage: 'granted',
                        analytics_storage: 'granted',
                        ad_user_data: 'granted',
                        ad_personalization: 'granted'
                    };
                    localStorage.setItem('rw_consent', JSON.stringify(consent));
                    applyConsent(consent);
                    banner.style.display = 'none';
                };

                var reject = function () {
                    var consent = {
                        ad_storage: 'denied',
                        analytics_storage: 'denied',
                        ad_user_data: 'denied',
                        ad_personalization: 'denied'
                    };
                    localStorage.setItem('rw_consent', JSON.stringify(consent));
                    applyConsent(consent);
                    banner.style.display = 'none';
                };

                if (acceptBtn) acceptBtn.addEventListener('click', accept);
                if (rejectBtn) rejectBtn.addEventListener('click', reject);
            })();
        </script>
